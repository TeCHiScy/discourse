      maxchoices: {disposition: migrated_adapted, target: "Discourse poll max option count", reason: "A positive source value is emitted as the Discourse poll max setting.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
  bbs.forum_polloption:
