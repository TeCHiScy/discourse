      dateline: {disposition: migrated_adapted, target: "UserBadge.granted_at and Discuz grant source_awarded_at", reason: "Latest qualifying award log time is converted to the badge grant date.", evidence: "script/import_scripts/discuz_x.rb#import_discuz_medals"}
