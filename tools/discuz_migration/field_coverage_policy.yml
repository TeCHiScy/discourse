  bbs.sinofsx_virtualairline_company: "Required custom feature: virtual-airline company records have no Discourse importer mapping yet; user asked to preserve this capability."
  bbs.sinofsx_virtualairline_nonaccept: "Required custom feature: virtual-airline exclusion/acceptance records have no Discourse importer mapping yet; user asked to preserve this capability."
