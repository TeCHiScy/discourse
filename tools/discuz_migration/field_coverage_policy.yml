patterns:
  - database: ucenter
    table_regex: "^pm_messages_[0-9]$"
    fields:
      pmid: {disposition: migrated_adapted, target: "Post import_id for private-message posts", reason: "Message ID is namespaced as pm:<pmid> to avoid collision with public posts.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
      plid: {disposition: migrated_adapted, target: "Private-message Topic identity", reason: "Message list ID groups the imported messages into one Discourse PM topic.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
      authorid: {disposition: migrated_adapted, target: "Post.user_id and PM participant set", reason: "Source author UID resolves to an imported account; unmapped authors cause the PM thread to be skipped.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
      message: {disposition: migrated_adapted, target: "Private-message Post.raw/cooked", reason: "Discuz message markup passes through the same BBCode conversion pipeline as public posts.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages, #process_discuzx_post"}
      dateline: {disposition: migrated_adapted, target: "Private-message Post.created_at", reason: "Unix timestamp is converted to a Discourse time value.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
  - database: ucenter
    table_regex: "^pm_lists$"
    fields:
      plid: {disposition: logic_only, target: "PM thread join key", reason: "Loads thread metadata for messages sharing this list ID.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
      subject: {disposition: migrated_direct, target: "Private-message Topic.title", reason: "Copies the source conversation subject.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
      pmtype: {disposition: migrated_adapted, target: "Private-message recipient construction", reason: "Selects direct-message participant parsing behavior.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
      min_max: {disposition: migrated_adapted, target: "Private-message direct participants", reason: "Direct-message UIDs are decoded from the min_max pair; separate per-message read/delete/recall state is not migrated.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
  - database: ucenter
    table_regex: "^pm_members$"
    fields:
      plid: {disposition: logic_only, target: "PM thread join key", reason: "Loads the member list for a private-message conversation.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
      uid: {disposition: migrated_adapted, target: "Discourse PM participants", reason: "Source UIDs are resolved to imported Discourse usernames.", evidence: "script/import_scripts/discuz_x.rb#import_private_messages"}
  - database: ucenter
    table_regex: "^members$"
    fields:
      uid: {disposition: logic_only, target: "Placeholder-account join key", reason: "Loads legacy account data only for UIDs referenced outside the source member table.", evidence: "script/import_scripts/discuz_x.rb#import_unrepresented_users"}
      username: {disposition: migrated_adapted, target: "Inactive placeholder User.username and User.name", reason: "Used only for referenced UIDs without a BBS member row; uniqueness/validation applies.", evidence: "script/import_scripts/discuz_x.rb#import_unrepresented_users"}
      email: {disposition: migrated_adapted, target: "Reserved placeholder email", reason: "Original UCenter email is not exposed as a confirmed address for an account lacking a BBS member row.", evidence: "script/import_scripts/discuz_x.rb#import_unrepresented_users"}
      regdate: {disposition: migrated_adapted, target: "Placeholder User.created_at", reason: "Unix timestamp is converted to a Discourse time value.", evidence: "script/import_scripts/discuz_x.rb#import_unrepresented_users"}
      password: {disposition: migrated_adapted, target: "UserCustomField discuz_password_hash for placeholder identity", reason: "Stored only for legacy-auth compatibility and never copied as a Discourse password hash.", evidence: "script/import_scripts/discuz_x.rb#import_unrepresented_users, #create_user"}
      salt: {disposition: migrated_adapted, target: "UserCustomField discuz_password_salt for placeholder identity", reason: "Stored with the source hash for legacy-auth compatibility.", evidence: "script/import_scripts/discuz_x.rb#import_unrepresented_users, #create_user"}
  - database: bbs
    table_regex: "^forum_attachment_[0-9]+$"
    fields:
