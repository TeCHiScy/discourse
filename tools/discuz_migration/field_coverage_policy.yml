  bbs.forum_post_history: "Post edit history is not imported; decide whether historical revisions are required in addition to the current and recoverable deleted content."
  bbs.portal_article_title: "Discuz Portal article content has no importer path yet; decide whether this site uses Portal content that must move."
  bbs.portal_article_content: "Discuz Portal article bodies have no importer path yet; decide whether this site uses Portal content that must move."
