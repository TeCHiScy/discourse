      name: {disposition: migrated_adapted, target: "Discourse Badge.name and MedalMapping.source_name", reason: "Source name is retained in the mapping and adapted to a unique badge name.", evidence: "script/import_scripts/discuz_x.rb#sync_discuz_medal_definition!"}
      description: {disposition: migrated_adapted, target: "Discourse Badge.description and MedalMapping.source_description", reason: "Description is retained with the target badge length limit applied.", evidence: "script/import_scripts/discuz_x.rb#sync_discuz_medal_definition!"}
      image: {disposition: migrated_adapted, target: "MedalMapping.source_image and Discuz medal image renderer", reason: "The original image URL is retained and rendered from the Discuz static asset host.", evidence: "script/import_scripts/discuz_x.rb#sync_discuz_medal_definition!; plugins/discourse-discuz-medals"}
