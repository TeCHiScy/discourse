version: 1
default:
  disposition: pending_review
  reason: >-
    No explicit field-level migration mapping or approved omission decision is recorded.
    Treat as an open audit item; do not infer that Discourse does not need it.

tables:
  bbs.common_member:
    fields:
      uid:
        disposition: migrated_adapted
        target: "User import identity: UserCustomField import_id, discuz_uid"
        reason: "Discuz UID becomes the stable source identity; Discourse assigns its own primary key."
        evidence: "script/import_scripts/discuz_x.rb#source_member_union, #create_user"
      username:
        disposition: migrated_adapted
        target: "User.username"
        reason: "Imported with Unicode enabled; Discourse uniqueness and validation still apply."
        evidence: "script/import_scripts/discuz_x.rb#import_users"
      email:
        disposition: migrated_adapted
        target: "User email address"
        reason: "Preserved unless duplicate or conflicting; those addresses are reserved and original value is retained in a custom field."
        evidence: "script/import_scripts/discuz_x.rb#import_users, #get_duplicate_email_uids"
      groupid:
        disposition: migrated_adapted
        target: "User.admin, User.moderator; UserCustomField discuz_group_id for paid-content group checks"
        reason: "Administrator/moderator roles are mapped; other group behavior is not reproduced."
        evidence: "script/import_scripts/discuz_x.rb#get_knowledge_about_group, #import_users, #import_discuz_sell_financials!"
        remaining_gap: "Complete Discuz user-group permission and membership behavior is not mapped."
      emailstatus:
        disposition: migrated_adapted
        target: "User activation and email-confirmed state"
        reason: "A verified source email activates the imported account only when the address remains unique and unchanged."
        evidence: "script/import_scripts/discuz_x.rb#create_user, #activate_discuz_user_from_verified_email!"
      avatarstatus:
        disposition: migrated_adapted
        target: "UserCustomField discuz_avatarstatus; Discuz avatar rendering adapter"
        reason: "Controls whether the renderer uses the original Discuz avatar URL or the Discourse default avatar."
        evidence: "script/import_scripts/discuz_x.rb#import_users; plugins/discourse-discuz-legacy-auth/lib/discourse_discuz_legacy_auth/user_avatar_extension.rb"
