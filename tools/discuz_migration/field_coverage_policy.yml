      replyperm: {disposition: migrated_adapted, target: "Category everyone read-only fallback and discuz_replyperm_configured", reason: "Restricted replies are reduced to read-only for everyone and full access for staff; group-specific reply permissions are not mapped.", evidence: "tools/discuz_migration/category_permissions.rb; script/import_scripts/discuz_x.rb#apply_category_access_fallback"}
  bbs.forum_access:
    fields:
      fid: {disposition: logic_only, target: "Detect category with user-specific view overrides", reason: "The importer checks whether any allowview override exists for a forum, but does not migrate per-user forum_access rows.", evidence: "script/import_scripts/discuz_x.rb#import_categories"}
      allowview: {disposition: logic_only, target: "Detect category with user-specific view overrides", reason: "Only nonzero values flag that user-specific visibility exists; the individual rows are not migrated.", evidence: "script/import_scripts/discuz_x.rb#import_categories"}
  bbs.forum_thread:
    fields:
      tid: {disposition: migrated_adapted, target: "Topic and first-post import_id mapping", reason: "Discuz topic identity is retained in import markers; Discourse IDs are assigned separately.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      fid: {disposition: migrated_adapted, target: "Topic.category_id", reason: "Source fid is resolved to an imported Discourse category ID.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      subject: {disposition: migrated_adapted, target: "Topic.title", reason: "HTML entities are decoded before import.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      displayorder: {disposition: migrated_adapted, target: "Topic visibility state and discuz_thread_displayorder custom field", reason: "Negative values cause the imported first post to enter recoverable trash; the value is also retained in a custom field.", evidence: "script/import_scripts/discuz_x.rb#import_posts, #apply_deferred_visibility_actions"}
      special: {disposition: migrated_adapted, target: "Discourse poll markup for source poll threads", reason: "special=1 reads poll metadata and prepends a Discourse poll; other special thread types are not converted.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      price: {disposition: migrated_adapted, target: "Discuz attachment topic_price metadata", reason: "Used for attachment purchase/access rendering; it is not a complete topic-sale migration.", evidence: "script/import_scripts/discuz_x.rb#import_attachment_metadata"}
  bbs.forum_post:
    fields:
      pid: {disposition: migrated_adapted, target: "Post import_id mapping", reason: "Discuz post ID is retained as an import marker.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      tid: {disposition: migrated_adapted, target: "Post.topic_id", reason: "Resolves a source topic to the imported Discourse topic.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      authorid: {disposition: migrated_adapted, target: "Post.user_id", reason: "Resolved through the Discuz UID mapping; unmapped authors are skipped and reported.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      message: {disposition: migrated_adapted, target: "Post.raw / cooked", reason: "Discuz BBCode, quotes, tables, smileys, attachments, links, and paid sections are parsed or converted by importer/plugins.", evidence: "script/import_scripts/discuz_x.rb#process_discuzx_post; plugins/discourse-discuz-bbcode"}
      dateline: {disposition: migrated_adapted, target: "Post.created_at", reason: "Unix timestamp is converted to a Discourse time value.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      usesig: {disposition: migrated_adapted, target: "PostCustomField discuz_usesig", reason: "Preserves whether this post requested its author's signature.", evidence: "script/import_scripts/discuz_x.rb#import_posts; plugins/discourse-discuz-legacy-auth"}
      anonymous: {disposition: migrated_adapted, target: "PostCustomField discuz_anonymous", reason: "Source anonymity flag is retained for compatible rendering.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
      invisible: {disposition: migrated_adapted, target: "PostCustomField discuz_invisible and recoverable trash state", reason: "Nonzero source visibility state is preserved by deleting the imported post through Discourse's recoverable trash path.", evidence: "script/import_scripts/discuz_x.rb#import_posts, #apply_deferred_visibility_actions"}
      first: {disposition: logic_only, target: "Topic first-post/reply structure", reason: "Identifies the first post and orders posts within their topics.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
  bbs.forum_poll:
    fields:
      tid: {disposition: logic_only, target: "Poll lookup key", reason: "Loads poll options for a source topic.", evidence: "script/import_scripts/discuz_x.rb#import_posts"}
